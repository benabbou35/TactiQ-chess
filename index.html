<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TactiQ Chess</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
  <div class="logo"><span>♞</span> TACTIQ CHESS</div>
  <button class="lang-current" onclick="toggleLang()">▼ AR</button>
</div>
<div class="lang-box" id="langBox">
  <button onclick="setLang('en')">🇺🇸 English</button>
  <button onclick="setLang('ar')" class="active">🇲🇦 العربية</button>
  <button onclick="setLang('fr')">🇫🇷 Français</button>
  <button onclick="setLang('es')">🇪🇸 Español</button>
  <button onclick="setLang('de')">🇩🇪 Deutsch</button>
</div>
<div class="hero">
  <h1 id="t-title">العب الشطرنج<br>مجاناً</h1>
  <p id="t-sub">مباريات مصنفة، محرك أستاذ كبير، ألغاز وبطولات</p>
  <div class="cta">
    <button class="btn btn-green" id="t-playOnline">🚀 العب أونلاين</button>
    <button class="btn btn-dark" id="t-playBot">العب ضد المحرك</button>
  </div>
</div>
<div class="board-wrap"><div id="mainBoard" class="board"></div></div>
<div class="status" id="status">دور الأبيض - إضغط على قطعة للعب</div>
<div class="nav">
  <button class="active">الرئيسية</button><button>اللعب</button><button>الألغاز</button><button>المحادثات</button><button>المزيد</button>
</div>
<script src="app.js"></script>
</body>
</html>
