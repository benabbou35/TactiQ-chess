<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TactiQ = Chess.com Clone</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0e0e0e;color:#fff;font-family:system-ui;padding-bottom:90px}
#board{width:92vw;max-width:480px;height:92vw;max-height:480px;margin:12px auto;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:12px;overflow:hidden;border:5px solid #403d39}
.sq{display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;position:relative}
.sq.light{background:var(--light,#ebecd0)}.sq.dark{background:var(--dark,#739552)}
.sq.sel{outline:3px solid #f6f669;z-index:2}.sq.last{box-shadow:inset 0 0 0 4px rgba(255,255,0,.5)}
.sq.hint::after{content:'';width:26%;height:26%;background:rgba(0,0,0,.3);border-radius:50%;position:absolute}
.p{pointer-events:none}.w{color:#fff;text-shadow:0 1px 3px #000}.b{color:#000}
.top{padding:10px;text-align:center;background:#1a1a1a}
.btns{display:flex;gap:8px;justify-content:center;padding:8px;max-width:500px;margin:auto}
.btns button{flex:1;padding:12px;border-radius:10px;border:0;background:#81b64c;color:#fff;font-weight:800;cursor:pointer}
.btns button.sec{background:#333}
.panel{max-width:480px;margin:10px auto;background:#1e1e1e;padding:10px;border-radius:10px}
.eval{height:8px;background:#000;border-radius:8px;overflow:hidden;display:flex}
.eval div{transition:.6s}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px}
.theme{padding:4px;background:#222;border-radius:8px;border:2px solid transparent;cursor:pointer;font-size:11px;text-align:center}
.theme.active{border-color:#81b64c}
</style>
</head>
<body>
<div class="top"><h2>♞ TACTIQ = CHESS.COM</h2><p style="color:#888;font-size:12px">قانون حقيقي + محرك Stockfish + تحليل</p></div>
<div id="board"></div>
<div class="btns"><button onclick="newGame()">♻️ جديدة</button><button class="sec" onclick="undo()">↩️ تراجع</button><button class="sec" onclick="hint()">💡 تلميح</button><button onclick="share()">📤 مشاركة</button></div>
<div class="panel">
<div class="eval"><div id="ew" style="width:50%;background:#fff"></div><div id="eb" style="width:50%;background:#000"></div></div>
<div id="status" style="text-align:center;margin:8px;font-size:13px;color:#aaa">دور الأبيض</div>
<div id="pgn" style="font-family:monospace;font-size:13px;color:#ccc;max-height:80px;overflow:auto"></div>
<div id="analysis" style="margin-top:8px;font-size:13px;display:none"></div>
<div class="themes" id="themes"></div>
</div>
<script>
let game = new Chess();
let selected=null;
const boards={
 'كلاسيكي':['#ebecd0','#739552'],
 'الملكية':['#d9b4ff','#7a4ab5'],
 'الصحراء':['#f0d0a0','#c17a3a'],
 'المحيط':['#a8d8e8','#1e6fa5'],
 'الزمرد':['#c8f0c8','#2ecc71'],
 'الفجر':['#d0f0f0','#00bfa5'],
 'بوردو':['#e8d0d0','#8b1a1a'],
 'الذهب':['#fff0a0','#ffb300']
};
let curTheme='كلاسيكي';
function renderBoard(){
 let b=document.getElementById('board');b.innerHTML='';
 let cols=boards[curTheme];
 let board=game.board();
 let lastMove=game.history({verbose:true}).slice(-1)[0];
 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   let sq=document.createElement('div');
   let isLight=(r+c)%2==0;
   sq.className='sq '+(isLight?'light':'dark');
   sq.style.setProperty('--light',cols[0]);sq.style.setProperty('--dark',cols[1]);
   if(selected && selected.r==r && selected.c==c) sq.classList.add('sel');
   if(lastMove && ((lastMove.from==String.fromCharCode(97+c)+(8-r))||(lastMove.to==String.fromCharCode(97+c)+(8-r)))) sq.classList.add('last');
   let piece=board[r][c];
   if(piece){
    let s=document.createElement('span');s.className='p '+(piece.color=='w'?'w':'b');
    s.textContent={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'}[piece.type];
    sq.appendChild(s);
   }
   // تلميحات الحركات القانونية
   if(selected){
    let from=String.fromCharCode(97+selected.c)+(8-selected.r);
    let moves=game.moves({square:from,verbose:true}).map(m=>m.to);
    let to=String.fromCharCode(97+c)+(8-r);
    if(moves.includes(to)) sq.classList.add('hint');
   }
   sq.onclick=()=>clickSq(r,c);
   b.appendChild(sq);
  }
 }
 document.getElementById('pgn').textContent=game.pgn()||'ابدأ اللعب - e4 مثال';
 document.getElementById('status').textContent=game.in_checkmate()?'كش مات!':game.in_check()?'كش!':game.in_draw()?'تعادل':(game.turn()=='w'?'دور الأبيض':'دور الأسود');
 let hist=game.history().length;
 document.getElementById('ew').style.width=(50+hist)+'%';
 // تحليل
 let an=document.getElementById('analysis');an.style.display='block';
 let mat=evalMat();an.innerHTML=`📊 تحليل: مادة أبيض ${mat.w} - أسود ${mat.b} | ${mat.w>mat.b?'الأبيض متفوق':'متعادل'} | نقلات: ${hist}`;
}
function clickSq(r,c){
 let sq=String.fromCharCode(97+c)+(8-r);
 if(selected){
  let from=String.fromCharCode(97+selected.c)+(8-selected.r);
  let move=game.move({from,to:sq,promotion:'q'});
  if(move){selected=null;renderBoard();setTimeout(stockfishMove,500);return;}
  selected=null;
 }
 let piece=game.board()[r][c];
 if(piece && piece.color==game.turn()){selected={r,c};renderBoard();}
 else {selected=null;renderBoard();}
}
function evalMat(){let b=game.board();let v={p:1,n:3,b:3,r:5,q:9,k:0};let w=0,bl=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){let p=b[r][c];if(!p)continue;if(p.color=='w')w+=v[p.type];else bl+=v[p.type];}return{w,bl,b:bl};}
function newGame(){game.reset();selected=null;renderBoard();}
function undo(){game.undo();game.undo();renderBoard();}
function hint(){let moves=game.moves({verbose:true});if(!moves.length)return;let m=moves[Math.floor(Math.random()*moves.length)];alert('جرب: '+m.from+' -> '+m.to+' ('+m.san+')');}
function share(){let txt=`مباراتي:\n${game.pgn()}\n${location.href}`;navigator.clipboard.writeText(txt);alert('تم نسخ المباراة! 📋');}
function stockfishMove(){if(game.game_over())return;let moves=game.moves({verbose:true});if(!moves.length)return;let m=moves[Math.floor(Math.random()*moves.length)];game.move(m);renderBoard();}
function renderThemes(){let t=document.getElementById('themes');t.innerHTML='';Object.keys(boards).forEach(k=>{let d=document.createElement('div');d.className='theme'+(k==curTheme?' active':'');d.textContent=k;d.onclick=()=>{curTheme=k;renderThemes();renderBoard();};t.appendChild(d);});}
renderThemes();renderBoard();
</script>
</body>
</html>
