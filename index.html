<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TactiQ Chess - Play Free</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0e0e0e;color:#fff;font-family:system-ui,Arial;min-height:100vh;padding-bottom:90px}
.header{background:#151515;display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.logo{font-weight:900}
.langs{display:flex;gap:6px;flex-wrap:wrap;padding:10px;justify-content:center}
.langs button{padding:7px 12px;border-radius:20px;border:2px solid #ddd;background:#fff;font-weight:700;font-size:13px}
.hero{text-align:center;padding:18px 14px}
.hero h1{font-size:32px;line-height:1.2;font-weight:900}
.hero p{color:#aaa;margin:10px 0 14px;font-size:14px}
.cta{display:flex;gap:10px;justify-content:center;max-width:400px;margin:auto}
.cta button{flex:1;padding:13px;border-radius:12px;font-weight:800;border:2px solid #81b64c;cursor:pointer}
.cta .g{background:#81b64c;color:#fff}
.cta .w{background:#fff;color:#000}
#board{width:92vw;max-width:400px;height:92vw;max-height:400px;margin:18px auto;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:10px;overflow:hidden;border:5px solid #f5e6c8}
.sq{display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer}
.sq.sel{outline:3px solid #ffe600;outline-offset:-3px}
.pW{color:#fff;text-shadow:0 1px 3px #000}
.pB{color:#000}
#msg{text-align:center;background:#1e1e1e;max-width:400px;margin:10px auto;padding:10px;border-radius:10px;color:#ccc;font-size:13px}
.nav{position:fixed;bottom:0;left:0;width:100%;background:#1a1a1a;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #333}
.nav button{background:#fff;border:0;padding:7px 12px;border-radius:8px;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div class="header"><div class="logo">♞ TACTIQ CHESS</div><div>▼ AR</div></div>
<div class="langs"><button>🇪🇸 Español</button><button>🇫🇷 Français</button><button style="border-color:#81b64c;background:#eaffd5">العربية</button><button>🇺🇸 English</button><button>🇩🇪 Deutsch</button></div>
<div class="hero"><h1>العب الشطرنج<br>مجاناً</h1><p>مباريات مصنفة، محرك أستاذ كبير، ألغاز وبطولات</p><div class="cta"><button class="w">العب ضد المحرك</button><button class="g">🚀 العب أونلاين</button></div></div>
<div id="board"></div>
<div id="msg">دور الأبيض - إضغط على قطعة بيضاء للعب</div>
<div class="nav"><button>الرئيسية</button><button>اللعب</button><button>الألغاز</button><button>المحادثات</button><button>المزيد</button></div>
<script>
let B=[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];
let sel=null;const icons={r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟',R:'♜',N:'♞',B:'♝',Q:'♛',K:'♚',P:'♟'};
function draw(){const board=document.getElementById('board');board.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){let d=document.createElement('div');let isLight=(r+c)%2===0;d.className='sq'+(sel&&sel.r==r&&sel.c==c?' sel':'');d.style.background=isLight?'#ebecd0':'#739552';let p=B[r][c];if(p){let s=document.createElement('span');s.className=p===p.toUpperCase()?'pW':'pB';s.textContent=icons[p];d.appendChild(s);}d.onclick=()=>clk(r,c);board.appendChild(d);}}
function clk(r,c){if(sel){if(sel.r===r&&sel.c===c){sel=null;draw();return;}B[r][c]=B[sel.r][sel.c];B[sel.r][sel.c]='';sel=null;document.getElementById('msg').textContent='تمت الحركة!';draw();}else{let p=B[r][c];if(!p||p!==p.toUpperCase())return;sel={r,c};draw();}}
draw();
</script>
</body>
</html>
