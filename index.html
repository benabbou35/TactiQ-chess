<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TACTIQ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1220;color:#fff;font-family:system-ui;padding-bottom:90px}
.top{text-align:center;padding:14px}
#turn{background:#1e293b;padding:8px 18px;border-radius:20px;font-size:13px;display:inline-block;margin-top:8px;border:1px solid #334155}
#wrap{width:92vw;max-width:420px;margin:12px auto;aspect-ratio:1/1}
#board{width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:12px;overflow:hidden;border:3px solid #1e293b}
.sq{display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;position:relative}
.sq.light{background:#b8c5d6}.sq.dark{background:#3d4f6a}
.sq.sel{background:#facc15!important}.sq.last{background:#fde68a!important}.sq.check{background:#ef4444!important}
.sq.hint::after{content:'';width:28%;height:28%;background:rgba(0,0,0,.4);border-radius:50%;position:absolute}
.p{font-weight:900;-webkit-text-stroke:1.2px;font-size:32px}
.p.w{color:#fff;-webkit-text-stroke-color:#000}.p.b{color:#0f172a;-webkit-text-stroke-color:#fff}
.controls{max-width:420px;margin:0 auto;padding:0 12px;display:flex;flex-direction:column;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{cursor:pointer;border-radius:12px;border:1px solid #334155;padding:12px;background:#1e293b;color:#fff;font-size:13px}
button:active{transform:scale(.97)}
button.active{background:#2563eb!important;border-color:#2563eb}
.big{padding:15px;font-weight:800;font-size:15px;border:0;width:100%}
.blue{background:#2563eb}.green{background:#16a34a}
#info{text-align:center;color:#94a3b8;font-size:12px;min-height:20px}
#pgn{font-size:11px;color:#64748b;text-align:center;word-break:break-all}
</style>
</head>
<body>
<div class="top"><h2>♞ TACTIQ</h2><div id="turn">● دور الأبيض</div></div>
<div id="wrap"><div id="board"></div></div>
<div class="controls">
<div id="info">Stockfish 16 جاهز - اضغط تلميح</div>
<div id="pgn"></div>
<div class="row3">
<button id="bw" class="active" onclick="setSide('w')">● أبيض</button>
<button id="bb" onclick="setSide('b')">● أسود</button>
<button onclick="alert('لعب ضد صديق قريبا')">👥 2 لاعبين</button>
</div>
<button class="big blue" onclick="newGame()">◂ لعبة جديدة</button>
<button class="big green" onclick="shareGame()">🌐 مشاركة</button>
<div class="row3"><button onclick="undoMove()">↩️ تراجع</button><button onclick="hintMove()">💡 تلميح</button><button onclick="stockfishMove()">🤖 Stockfish يلعب</button></div>
</div>

<script>
var game=new Chess(), sel=null, player='w', engine=null;
var uni={p:'♟',r:'♜',n:'♞',b:'♝',q:'♛',k:'♚'};

function drawBoard(){
 var boardEl=document.getElementById('board');boardEl.innerHTML='';
 var bd=game.board(), hist=game.history({verbose:true}), last=hist[hist.length-1];
 var kingSq=null;if(game.in_check()){for(var r=0;r<8;r++)for(var c=0;c<8;c++){var p=bd[r][c];if(p&&p.type=='k'&&p.color==game.turn())kingSq=String.fromCharCode(97+c)+(8-r);}}
 for(var r=0;r<8;r++)for(var c=0;c<8;c++){
  var d=document.createElement('div');var light=(r+c)%2==0;d.className='sq '+(light?'light':'dark');
  var sqName=String.fromCharCode(97+c)+(8-r);
  if(sel&&sel.r==r&&sel.c==c)d.classList.add('sel');
  if(last&&(last.from==sqName||last.to==sqName))d.classList.add('last');
  if(kingSq==sqName)d.classList.add('check');
  if(sel){var from=String.fromCharCode(97+sel.c)+(8-sel.r);var moves=game.moves({square:from,verbose:true});for(var i=0;i<moves.length;i++)if(moves[i].to==sqName)d.classList.add('hint');}
  var p=bd[r][c];if(p){var s=document.createElement('span');s.className='p '+(p.color=='w'?'w':'b');s.textContent=uni[p.type];d.appendChild(s);}
  (function(rr,cc){d.onclick=function(){clickSq(rr,cc)}})(r,c);
  boardEl.appendChild(d);
 }
 document.getElementById('pgn').textContent=game.pgn()||'ابدأ اللعب';
 var status=game.in_checkmate()?'كش مات!':game.in_stalemate()?'تعادل':game.in_check()?'كش! ':'دور '+(game.turn()=='w'?'الأبيض':'الأسود');
 document.getElementById('turn').textContent=status;
}

function clickSq(r,c){
 var sq=String.fromCharCode(97+c)+(8-r);
 if(sel){
  var from=String.fromCharCode(97+sel.c)+(8-sel.r);
  var promo='q';if(game.board()[sel.r][sel.c]?.type=='p'&&(r==0||r==7)){promo=prompt('ترقية ل: q,w r,b n','q')||'q';}
  var mv=game.move({from:from,to:sq,promotion:promo});
  if(mv){sel=null;drawBoard();if(!game.game_over()&&game.turn()!=player)setTimeout(stockfishMove,500);return;}
  sel=null;
 }
 var p=game.board()[r][c];if(p&&p.color==game.turn()){sel={r:r,c:c};drawBoard();}else{sel=null;drawBoard();}
}

function initEngine(){
 if(engine)return;
 engine=new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
 engine.onmessage=function(e){
  var line=e.data;if(typeof line!=='string')return;
  if(line.indexOf('bestmove')>-1){
   var best=line.split(' ')[1];
   if(best&&best!='(none)'&&best.length>=4){
    game.move({from:best.slice(0,2),to:best.slice(2,4),promotion:best[4]||'q'});
    drawBoard();
   }
  }
  if(line.indexOf('score cp')>-1){var m=line.match(/score cp (-?\d+)/);if(m){var cp=parseInt(m[1])/100;document.getElementById('info').innerHTML='📊 Stockfish: '+(cp>0?'+':'')+cp.toFixed(2)+' '+(cp>1?'الأبيض رابح':cp<-1?'الأسود رابح':'متعادل');}}
 };
 engine.postMessage('uci');
}

function stockfishMove(){
 if(game.game_over())return;
 initEngine();
 document.getElementById('turn').textContent='● Stockfish كيفكر (قوي)...';
 engine.postMessage('position fen '+game.fen());
 engine.postMessage('go depth 18');
}
function setSide(s){player=s;document.getElementById('bw').classList.toggle('active',s=='w');document.getElementById('bb').classList.toggle('active',s=='b');newGame();if(s=='b')setTimeout(stockfishMove,600);}
function newGame(){game.reset();sel=null;drawBoard();document.getElementById('info').textContent='لعبة جديدة - Stockfish جاهز';}
function undoMove(){game.undo();game.undo();drawBoard();}
function hintMove(){stockfishMove();}
function shareGame(){var txt=game.pgn();navigator.clipboard.writeText(txt).then(function(){alert('تم نسخ PGN 📋')});}
drawBoard();
</script>
</body>
</html>
