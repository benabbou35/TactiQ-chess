<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>FIXED</title><style>body{background:#0f0f0f;color:#fff}#board{width:90vw;height:90vw;max-width:400px;max-height:400px;margin:20px auto;display:grid;grid-template-columns:repeat(8,1fr);border:6px solid #f0d9b5}.sq{display:flex;align-items:center;justify-content:center;font-size:30px}.light{background:#ebecd0}.dark{background:#739552}.pW{color:#fff;text-shadow:0 0 3px #000}.pB{color:#000}</style></head><body><div id="board"></div><script>let B=[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];let icons={r:'♜',n:'♞',b:'♝',q:'♛',k:'♚',p:'♟',R:'♜',N:'♞',B:'♝',Q:'♛',K:'♚',P:'♟'};let board=document.getElementById('board');for(let r=0;r<8;r++)for(let c=0;c<8;c++){let d=document.createElement('div');d.className='sq '+((r+c)%2==0?'light':'dark');let p=B[r][c];if(p){let s=document.createElement('span');s.className=p==p.toUpperCase()?'pW':'pB';s.textContent=icons[p];d.appendChild(s);}board.appendChild(d);}</script></body></html>
