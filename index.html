<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TactiQ Chess - 5 Languages</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div class="header"><div class="logo">♔ TACTIQ <span>CHESS</span></div>
<div class="lang-switch"><button onclick="toggleLang()" id="curLang">AR ▼</button>
<div class="lang-box" id="langBox">
<button onclick="setLang('ar')">🇲🇦 العربية</button>
<button onclick="setLang('en')">🇺🇸 English</button>
<button onclick="setLang('fr')">🇫🇷 Français</button>
<button onclick="setLang('es')">🇪🇸 Español</button>
<button onclick="setLang('de')">🇩🇪 Deutsch</button>
</div></div></div>
<div id="home" class="view active"><div class="hero">
<h1 id="t-title">العب الشطرنج<br>أونلاين مجانا</h1>
<p id="t-sub">مباريات مصنفة، محرك أستاذ كبير، ألغاز وبطولات</p>
<button class="btn btn-green" id="t-play">العب أونلاين 🚀</button>
<button class="btn btn-dark" id="t-bot">العب ضد المحرك</button></div>
<div id="mainBoard" class="board"></div></div>
<div class="nav"><button class="active"><span id="n1">الرئيسية</span></button><button><span id="n2">اللعب</span></button><button><span id="n3">الألغاز</span></button><button><span id="n4">المحادثات</span></button><button><span id="n5">المزيد</span></button></div>
<script src="engine.js"></script><script src="app.js"></script></body></html>
